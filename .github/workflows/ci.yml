# go-tpm2/validate CI — build the eight TamaGo guest harnesses.
#
# validate is a HARNESS, not a library: it boots a TamaGo amd64 guest under
# QEMU and drives a REAL TPM 2.0 (swtpm via `-device tpm-crb`/`tpm-tis`).
# The live swtpm + QEMU round-trips cannot run in hosted CI without a
# software-TPM + a full-system QEMU, so CI is BUILD-ONLY: it proves every
# harness still compiles for tamago/amd64 against the published go-tpm2
# modules. The actual PASS/FAIL proofs run locally via the run-*.sh scripts.
#
# TamaGo is not a stock GOOS, so we build the TamaGo toolchain from source
# (usbarmory/tamago, the version pinned in go.mod) using a stock Go as the
# bootstrap, then use it to cross-build the guest ELFs. There are no
# host-side Go tests in this module.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  build:
    name: build tamago guest harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: validate

      # Stock Go to bootstrap the TamaGo toolchain.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: true

      # The toolchain version is READ FROM go.mod rather than pinned here.
      # Pinned, the two drift the moment anything bumps the module: a pull
      # request raising github.com/usbarmory/tamago to v1.27.1 was built with
      # a toolchain still cloned at tamago-go1.26.4, and failed with
      #
      #     go: GOOSPKG="github.com/usbarmory/tamago" not found in module list
      #
      # which names neither version and reads like a broken module path. The
      # comment at the top of this file already said "the version pinned in
      # go.mod"; this makes that true.
      #
      # `go mod edit -json` parses go.mod offline and exactly -- no module
      # download, no network, and no regex over a file whose `require` block
      # can be written two ways.
      - name: Resolve the TamaGo version from go.mod
        working-directory: validate/guest
        run: |
          set -euo pipefail
          v=$(go mod edit -json \
              | jq -r '.Require[] | select(.Path=="github.com/usbarmory/tamago") | .Version')
          if [ -z "$v" ] || [ "$v" = "null" ]; then
            echo "::error::github.com/usbarmory/tamago is not required in go.mod"
            exit 1
          fi
          echo "TAMAGO_VERSION=${v#v}" >> "$GITHUB_ENV"
          echo "tamago toolchain: ${v#v} (from go.mod)"

      - name: Build TamaGo toolchain from source
        run: |
          git clone --depth 1 --branch "tamago-go${TAMAGO_VERSION}" \
            https://github.com/usbarmory/tamago-go tamago-go
          cd tamago-go/src
          # Bootstrap with the stock Go installed above.
          GOROOT_BOOTSTRAP="$(go env GOROOT)" ./make.bash
          echo "TAMAGO=${GITHUB_WORKSPACE}/tamago-go/bin/go" >> "$GITHUB_ENV"

      - name: Show TamaGo version
        run: "$TAMAGO version"

      # guest/ is the repository's only module and is nested so a host
      # `go mod tidy` never sees the tamago imports (go-tpm2/validate#4). Its
      # go.sum can only be tidied with the tamago toolchain, so tidiness is
      # checked here: a sweep that tidied on a host, or a bump that left stale
      # sums, fails this step instead of the build naming a package.
      - name: guest go.mod/go.sum are tidy (tamago toolchain)
        working-directory: validate/guest
        run: |
          set -euo pipefail
          GOOS=tamago GOARCH=amd64 GOOSPKG=github.com/usbarmory/tamago "$TAMAGO" mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build all eight harnesses (tamago/amd64)
        working-directory: validate/guest
        run: |
          set -euo pipefail
          for c in cmd/*/; do
            n="$(basename "$c")"
            echo "== building $n =="
            GOOS=tamago GOARCH=amd64 GOOSPKG=github.com/usbarmory/tamago \
              "$TAMAGO" build -ldflags "-T 0x10010000 -R 0x1000" \
              -o "/tmp/${n}.elf" "./$c"
          done
          echo "all harnesses built"
